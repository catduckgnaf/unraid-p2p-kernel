name: Upstream update watch

on:
  pull_request:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch live sources without creating issues
        type: boolean
        default: true
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Scan feeds in dry-run mode
        run: python3 scripts/upstream_watch.py --dry-run --output upstream-alerts.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-alerts
          path: upstream-alerts.json
          if-no-files-found: error
  publish:
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Create deduplicated issue alerts from trusted main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/upstream_watch.py
